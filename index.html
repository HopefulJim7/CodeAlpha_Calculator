<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="calculator">
    <div class="screen" aria-live="polite">
      <div id="history" class="history"></div>
      <div id="value" class="value">0</div>
    </div>

    <div id="keypad" class="keypad">
      <button class="key fn" data-action="clear">AC</button>
      <button class="key fn" data-action="delete" aria-label="Delete">DEL</button>
      <button class="key fn" data-action="percent">%</button>
      <button class="key op" data-operator="/" aria-label="Divide">&divide;</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key op" data-operator="*" aria-label="Multiply">&times;</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key op" data-operator="-" aria-label="Subtract">&minus;</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key op" data-operator="+" aria-label="Add">+</button>

      <button class="key zero" data-digit="0">0</button>
      <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="key equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <p class="credit">CodeAlpha Frontend Internship &middot; Task 2 &middot; Built by Jim</p>
  <script src="js/calculator.js"></script>
</body>
</html>
